name: Build and Publish Docker Images

on:
  push:
    paths:
      - "**"
      - "!docs/**"
      - "!deploy/**"
      - "!setup.py"
      - "!.gitignore"
      - "!.github/workflows/**"
      - ".github/workflows/docker.yml"
    branches:
      - "main"
    tags:
      - "v?[0-9]+.[0-9]+.[0-9]*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Docker Hub is published to as well, but only ever as :nightly - see the metadata step below.
  DOCKERHUB_IMAGE: ubufugu/dockipelago

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image-name: ${{ steps.image.outputs.name }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      package-name: ${{ steps.package.outputs.name }}
      hub-tags: ${{ steps.hub-meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set lowercase image name
        id: image
        run: |
          echo "name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Set package name
        id: package
        run: |
          echo "name=$(basename ${GITHUB_REPOSITORY,,})" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch,enable={{is_not_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=nightly,enable={{is_default_branch}}

      # Deliberately separate from the GHCR metadata above rather than a second entry in its
      # images list. That one runs with the default latest=auto flavor, which would move
      # ubufugu/dockipelago:latest on every version tag; latest there is published by hand and must
      # not be touched by an automated build. latest=false makes that structural rather than
      # something to remember, and nightly is the only rule this one carries.
      - name: Extract Docker Hub metadata
        id: hub-meta
        uses: docker/metadata-action@v6.0.0
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=nightly,enable={{is_default_branch}}

      - name: Compute final tags
        id: final-tags
        run: |
          readarray -t tags <<< "${{ steps.meta.outputs.tags }}"

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
            if [[ "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              full_latest="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest"
              # Check if latest is already in tags to avoid duplicates
              if ! printf '%s\n' "${tags[@]}" | grep -q "^$full_latest$"; then
                tags+=("$full_latest")
              fi
            fi
          fi

          # Set multiline output
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          printf '%s\n' "${tags[@]}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      # The secrets context cannot be read from a step's `if`, so the one thing the steps need to
      # know about the credential is decided here, where it can be. Both halves are required: a
      # token without the username it belongs to authenticates nothing.
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    strategy:
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-latest
            suffix: amd64
            cache-scope: amd64
          - platform: arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
            cache-scope: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Skipped where the secret is not readable - a pull request from a fork - so those builds
      # still produce their GHCR images instead of failing on a login they were never going to make.
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute suffixed tags
        id: tags
        env:
          GHCR_TAGS: ${{ needs.prepare.outputs.tags }}
          HUB_TAGS: ${{ needs.prepare.outputs.hub-tags }}
          PUSH_TO_HUB: ${{ env.HAS_DOCKERHUB }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          # Read through the environment rather than interpolating tag text straight into the
          # script, and drop blanks: the Docker Hub list is empty off the default branch.
          suffixed=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && suffixed+=("$tag-$SUFFIX")
          done <<< "$GHCR_TAGS"
          if [[ "$PUSH_TO_HUB" == "true" ]]; then
            while IFS= read -r tag; do
              [[ -n "$tag" ]] && suffixed+=("$tag-$SUFFIX")
            done <<< "$HUB_TAGS"
          fi
          echo "tags=$(IFS=','; echo "${suffixed[*]}")" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.0.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.platform }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ needs.prepare.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}
          provenance: false

  manifest:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        env:
          GHCR_TAGS: ${{ needs.prepare.outputs.tags }}
          HUB_TAGS: ${{ needs.prepare.outputs.hub-tags }}
          PUSH_TO_HUB: ${{ env.HAS_DOCKERHUB }}
        run: |
          tags=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && tags+=("$tag")
          done <<< "$GHCR_TAGS"
          if [[ "$PUSH_TO_HUB" == "true" ]]; then
            while IFS= read -r tag; do
              [[ -n "$tag" ]] && tags+=("$tag")
            done <<< "$HUB_TAGS"
          fi

          for tag in "${tags[@]}"; do
            docker manifest create "$tag" \
              "$tag-amd64" \
              "$tag-arm64"

            docker manifest push "$tag"
          done
